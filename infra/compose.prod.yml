name: caltrek

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caltrek}
      POSTGRES_USER: ${POSTGRES_USER:-caltrek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrations:
    image: ${DOCKERHUB_NAMESPACE:-your-dockerhub-user}/caltrek-migrations:${CALTREK_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/migrations.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-caltrek}
      FLYWAY_USER: ${POSTGRES_USER:-caltrek}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production env file}
    command: ["-connectRetries=60", "migrate"]
    networks:
      - backend

  api:
    image: ${DOCKERHUB_NAMESPACE:-your-dockerhub-user}/caltrek-api:${CALTREK_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      args:
        JDK_VERSION: ${JDK_VERSION:-25}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-caltrek}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-caltrek}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production env file}
      SPRING_SQL_INIT_MODE: never
      CALTREK_JWT_SECRET: ${CALTREK_JWT_SECRET:?Set CALTREK_JWT_SECRET in your production env file}
      CALTREK_CORS_ALLOWED_ORIGINS: ${CALTREK_CORS_ALLOWED_ORIGINS:?Set CALTREK_CORS_ALLOWED_ORIGINS in your production env file}
      OPENFOODFACTS_BASE_URL: ${OPENFOODFACTS_BASE_URL:-https://world.openfoodfacts.org}
      OPENFOODFACTS_USER_AGENT: ${OPENFOODFACTS_USER_AGENT:-caltrek/0.1 production}
      OPENFOODFACTS_TIMEOUT: ${OPENFOODFACTS_TIMEOUT:-PT2S}
      OPENFOODFACTS_MAX_RETRIES: ${OPENFOODFACTS_MAX_RETRIES:-1}
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  web:
    image: ${DOCKERHUB_NAMESPACE:-your-dockerhub-user}/caltrek-web:${CALTREK_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "${WEB_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:

spring:
  application:
    name: caltrek-api
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/caltrek}
    username: ${SPRING_R2DBC_USERNAME:caltrek}
    password: ${SPRING_R2DBC_PASSWORD:caltrek}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080

caltrek:
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  security:
    jwt-secret: ${CALTREK_JWT_SECRET:change-this-local-development-secret-with-at-least-32-bytes}
    access-token-ttl: ${CALTREK_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${CALTREK_REFRESH_TOKEN_TTL:P30D}
  integrations:
    open-food-facts:
      base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
      user-agent: ${OPENFOODFACTS_USER_AGENT:caltrek/0.1 (local-development)}
      timeout: ${OPENFOODFACTS_TIMEOUT:PT2S}
      max-retries: ${OPENFOODFACTS_MAX_RETRIES:1}
